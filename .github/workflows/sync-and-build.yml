name: Sync Upstream and Build Firmware

on:
  schedule:
    # 每 6 小时自动检查一次上游更新 (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      machine:
        description: '目标机型 (Makefile MACHINE 参数)'
        required: false
        default: 'RUIYING_RY_4GT_2SX'
        type: string
      config:
        description: '默认启动配置文件 (Makefile CONFIG 参数)'
        required: false
        default: 'config-RY-4GT-2SX.txt'
        type: string
      force_build:
        description: '即使上游没有更新也强制编译'
        required: false
        default: true
        type: boolean

concurrency:
  group: sync-and-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Sync upstream (logicog/RTLPlayground)
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.sync.outputs.updated }}
      commit_sha: ${{ steps.sync.outputs.commit_sha }}
      commit_short: ${{ steps.sync.outputs.commit_short }}

    steps:
      - name: Checkout fork repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          # 如上游修改了 .github/workflows/ 下文件，需在仓库 Secrets 中配置带 repo + workflow 权限的 SYNC_PAT
          token: ${{ secrets.SYNC_PAT || github.token }}

      - name: Fetch and merge upstream/main
        id: sync
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/logicog/RTLPlayground.git
          git fetch upstream main

          AHEAD=$(git rev-list --count HEAD..upstream/main)
          echo "Upstream commits ahead: ${AHEAD}"

          if [ "${AHEAD}" -gt 0 ]; then
            git merge --no-edit -m "Merge upstream/main [skip ci]" upstream/main
            git push origin HEAD:main
            gh workflow disable build.yml || true
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

          SHA=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short HEAD)
          echo "commit_sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "commit_short=${SHORT}" >> "$GITHUB_OUTPUT"

  build:
    name: Build firmware (${{ inputs.machine || 'RUIYING_RY_4GT_2SX' }})
    needs: sync
    if: needs.sync.outputs.updated == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_build)
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    env:
      MACHINE: ${{ inputs.machine || 'RUIYING_RY_4GT_2SX' }}
      CONFIG_FILE: ${{ inputs.config || 'config-RY-4GT-2SX.txt' }}

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            make \
            gcc \
            g++ \
            pkg-config \
            bison \
            flex \
            libboost-dev \
            patch \
            bzip2 \
            curl \
            ca-certificates \
            xxd \
            jq \
            python-is-python3 \
            libjson-c-dev \
            zlib1g-dev \
            git

      - name: Checkout synced commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.commit_sha }}
          fetch-depth: 0

      - name: Cache patched SDCC toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: sdcc-${{ hashFiles('sdcc/*') }}

      - name: Build firmware
        id: build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BUILD_DATE=$(TZ=UTC-8 date +"%Y-%m-%d %H:%M:%S")
          make MACHINE="${MACHINE}" CONFIG="${CONFIG_FILE}" BUILD_DATE="${BUILD_DATE}"
          BIN_PATH=""
          for f in "output/${MACHINE}/"*.bin; do
            BIN_PATH="$f"
            break
          done
          BIN_NAME=$(basename "${BIN_PATH}")
          ls -lh "${BIN_PATH}"
          sha256sum "${BIN_PATH}" > "output/${MACHINE}/SHA256SUMS.txt"
          cat "output/${MACHINE}/SHA256SUMS.txt"
          echo "bin_path=${BIN_PATH}" >> "$GITHUB_OUTPUT"
          echo "bin_name=${BIN_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload firmware binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.bin_name }}
          path: ${{ steps.build.outputs.bin_path }}
          archive: false
          retention-days: 30

      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS-${{ env.MACHINE }}-${{ needs.sync.outputs.commit_short }}.txt
          path: output/${{ env.MACHINE }}/SHA256SUMS.txt
          archive: false
          retention-days: 30

      - name: Write build summary
        run: |
          {
            echo "### 固件编译完成"
            echo ""
            echo "- **目标机型**: \`${MACHINE}\`"
            echo "- **配置文件**: \`${CONFIG_FILE}\`"
            echo "- **提交版本**: \`${{ needs.sync.outputs.commit_short }}\`"
            echo "- **上游同步**: \`${{ needs.sync.outputs.updated }}\`"
            echo ""
            echo '```'
            cat "output/${MACHINE}/SHA256SUMS.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
